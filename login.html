<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ROUNZ | 로그인</title>
  </head>
  <body class="login-body">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="header-C" data-component="header">
    </header>

    <aside
      class="hamburger-nav"
      id="hamburger-nav"
      aria-label="전체 메뉴"
      data-component="hamburger-nav"
      hidden
    >
      <div class="hamburger-nav__head">
        <strong>ROUNZ</strong>
        <button
          type="button"
          class="icon-button"
          aria-label="전체 메뉴 닫기"
          data-action="close-menu"
        >
          ×
        </button>
      </div>

      <nav class="hamburger-nav__quick" aria-label="빠른 메뉴">
        <a href="index.html">홈</a>
        <a href="product-list.html">상품</a>
        <a href="cart.html">장바구니</a>
        <a href="login.html">로그인</a>
      </nav>

      <nav class="hamburger-nav__section" aria-label="카테고리">
        <h2>카테고리</h2>
        <a href="product-list.html">전체 상품</a>
        <a href="product-list.html?category=glasses">안경</a>
        <a href="product-list.html?category=sunglasses">선글라스</a>
        <a href="product-list.html?category=clip-on">클립온</a>
        <a href="product-list.html?category=smart">스마트 안경</a>
      </nav>
    </aside>

    <main id="main" class="login-page">
      <section class="login-panel" aria-labelledby="login-title">
        <header class="login-panel__brand">
          <p class="login-panel__eyebrow">WELCOME BACK</p>
          <h2 id="login-title">ROUNZ</h2>
          <p>나에게 맞는 안경을 찾아드립니다</p>
        </header>

        <section class="login-social" aria-labelledby="social-login-title">
          <h3 id="social-login-title" class="sr-only">소셜 로그인</h3>
          <a class="login-social__button login-social__button--kakao" href="#">
            <span aria-hidden="true">●</span>
            카카오로 로그인
          </a>
          <a class="login-social__button login-social__button--naver" href="#">
            <span aria-hidden="true">N</span>
            네이버로 로그인
          </a>
          <a class="login-social__button login-social__button--apple" href="#">
            <span aria-hidden="true">●</span>
            Apple로 로그인
          </a>
          <a class="login-social__button login-social__button--google" href="#">
            <span aria-hidden="true">G</span>
            Google로 로그인
          </a>
        </section>

        <div class="login-divider" aria-hidden="true">
          <span>또는</span>
        </div>

        <form class="login-form" action="#" method="post">
          <label class="login-field" for="login-email">
            <span class="login-field__label">이메일</span>
            <input
              id="login-email"
              name="email"
              type="email"
              placeholder="hello@example.com"
              autocomplete="email"
              required
            />
          </label>

          <label class="login-field" for="login-password">
            <span class="login-field__label">비밀번호</span>
            <span class="login-field__control">
              <input
                id="login-password"
                name="password"
                type="password"
                placeholder="********"
                autocomplete="current-password"
                required
              />
              <span class="login-field__icon" aria-hidden="true"></span>
            </span>
          </label>

          <a class="login-form__help" href="#">비밀번호 찾기</a>

          <div class="login-form__actions">
            <button class="login-button login-button--primary" type="submit">로그인</button>
            <a class="login-button login-button--secondary" href="product-list.html">
              게스트로 쇼핑하기
            </a>
          </div>
        </form>

        <p class="login-panel__signup">
          아직 회원이 아니신가요?
          <a href="signup.html">회원가입</a>
        </p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="하단 내비게이션" data-component="bottom-nav">
      <a href="index.html"> <span class="material-icons" aria-hidden="true">home</span> 홈 </a>

      <a href="product-list.html">
        <span class="material-icons" aria-hidden="true">grid_on</span> 상품
      </a>

      <a href="#search-modal" data-action="open-search">
        <span class="material-icons" aria-hidden="true">search</span>
        검색
      </a>

      <a href="cart.html">
        <span class="material-icons" aria-hidden="true">local_mall</span>
        <span class="cart-badge" aria-label="장바구니 상품 수">0</span>
        장바구니
      </a>

      <a href="login.html" aria-current="page">
        <span class="material-icons" aria-hidden="true">person</span>
        내정보
      </a>
    </nav>

    <footer class="site-footer" data-component="footer"></footer>

    <!-- 고정버튼 -->
    <button
      class="fixed-chat-button"
      aria-label="AI 상담 시작"
      type="button"
      data-action="open-inquiry"
    >
      <span class="material-icons">chat</span>
    </button>

    <!-- 햄버거(모듈) -->
    <aside
      class="hamburger-menu"
      id="hamburger-menu"
      aria-label="전체 메뉴"
      data-component="hamburger-menu"
      hidden
    ></aside>

    <!-- 문의 폼 (모듈)-->
    <dialog class="inquiry-dialog" id="inquiry-dialog" aria-labelledby="inquiry-title"></dialog>

    <dialog class="modal" id="search-modal" aria-labelledby="search-modal-title">
      <form method="dialog" class="modal__content">
        <div class="modal__head">
          <h2 id="search-modal-title">검색</h2>
          <button type="submit" class="icon-button" aria-label="검색 닫기">×</button>
        </div>

        <label class="form-field">
          <span>검색어</span>
          <input type="search" name="keyword" placeholder="브랜드 또는 상품명을 입력하세요" />
        </label>
      </form>
    </dialog>

    <div class="toast" role="status" aria-live="polite" data-component="toast"></div>

    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
