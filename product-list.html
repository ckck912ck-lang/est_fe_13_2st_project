<!-- 상품목록 : 배정호 작성 -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>상품 목록 | ROUNZ</title>
  </head>
  <body class="product-list-body">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <!-- 헤더(모듈) -->
    <header class="header"></header>

    <!-- 햄버거(모듈) -->
    <aside
      class="hamburger-menu"
      id="hamburger-menu"
      aria-label="전체 메뉴"
      data-component="hamburger-menu"
      hidden
    ></aside>

    <!-- 메인 -->
    <main id="main" class="main product-list-page">
      <section class="product-list-top-section" aria-labelledby="product-list-title">
        <!-- 필터 모달 -->
        <dialog class="product-filter-dialog" data-dialog="product-filter" closedby="any">
          <form class="filter-form" method="dialog">
            <div class="filter-header">
              <h2 class="filter-title">필터</h2>

              <button type="button" class="filter-close-button" aria-label="필터 닫기">
                <span class="material-icons" aria-hidden="true">close</span>
              </button>
            </div>

            <div class="filter-body">
              <section class="filter-group">
                <h3 class="filter-group-title">추천 상품</h3>

                <div class="filter-chip-list filter-chip-list-grid1">
                  <label class="filter-chip">
                    <input type="checkbox" name="best" hidden />
                    <span>BEST</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="new" hidden />
                    <span>NEW</span>
                  </label>
                </div>
              </section>

              <section class="filter-group">
                <h3 class="filter-group-title">카테고리</h3>

                <div class="filter-chip-list filter-chip-list-grid1">
                  <label class="filter-chip">
                    <input type="checkbox" name="category" value="안경" />
                    <span>안경</span>
                  </label>
                  <label class="filter-chip">
                    <input type="checkbox" name="category" value="선글라스" />
                    <span>선글라스</span>
                  </label>
                  <label class="filter-chip">
                    <input type="checkbox" name="category" value="클립온" />
                    <span>클립온</span>
                  </label>
                  <label class="filter-chip">
                    <input type="checkbox" name="category" value="고글" />
                    <span>고글</span>
                  </label>
                </div>
              </section>

              <section class="filter-group">
                <h3 class="filter-group-title">브랜드</h3>

                <div class="filter-brand-scroll">
                  <div class="filter-chip-list filter-chip-list-grid3">
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="Ray-Ban" /><span
                        >RAY-BAN</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="PUBLIC BEACON" /><span
                        >PUBLIC BEACON</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="MUSEUM BY BEACON" /><span
                        >MUSEUM BY BEACON</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="FAKEME" /><span
                        >FAKEME</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="CLICCLAC" /><span
                        >CLICCLAC</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="RADIO EYES" /><span
                        >RADIO EYES</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="ROUNZ BASIC" /><span
                        >ROUNZ BASIC</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="LOCOMOTIVE" /><span
                        >LOCOMOTIVE</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="PARANOID" /><span
                        >PARANOID</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="BVH" /><span>BVH</span></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="STYLE:WORK" /><span
                        >STYLE:WORK</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="TART OPTICAL" /><span
                        >TART OPTICAL</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="STEPHANE CHRISTIAN" /><span
                        >STEPHANE CHRISTIAN</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="NINE ACCORD" /><span
                        >NINE ACCORD</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="CARVEN" /><span
                        >CARVEN</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="BJ CLASSIC" /><span
                        >BJ CLASSIC</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="FRANK CUSTOM" /><span
                        >FRANK CUSTOM</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="ROUNZ ABSOLUTE" /><span
                        >ROUNZ ABSOLUTE</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="ROUNZ STANDARD" /><span
                        >ROUNZ STANDARD</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="1.618" /><span>1.618</span></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="BLIZ" /><span>BLIZ</span></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="RUDY PROJECT" /><span
                        >RUDY PROJECT</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="OAKLEY" /><span
                        >OAKLEY</span
                      ></label
                    >
                    <label class="filter-chip"
                      ><input type="checkbox" name="brand" value="PRADA" /><span>PRADA</span></label
                    >
                  </div>
                </div>
              </section>

              <section class="filter-group">
                <h3 class="filter-group-title">프레임 모양</h3>

                <div class="filter-chip-list filter-chip-list-grid2">
                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Aviator" />
                    <span>에비에이터</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Cat-eye" />
                    <span>캣아이</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Others" />
                    <span>기타</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Rimless" />
                    <span>무테</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Round" />
                    <span>라운드</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Browline" />
                    <span>브로우라인</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Mixed" />
                    <span>믹스</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Panto" />
                    <span>판토</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Oval" />
                    <span>오벌</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" name="eyeWearShape" value="Goggle" />
                    <span>고글</span>
                  </label>
                </div>
              </section>

              <section class="filter-group">
                <h3 class="filter-group-title">가격대</h3>

                <div class="filter-price-button-list">
                  <label class="filter-price-button">
                    <input type="radio" name="priceRange" value="0-100000" />
                    <span>10만원 이하</span>
                  </label>
                  <label class="filter-price-button">
                    <input type="radio" name="priceRange" value="100000-200000" />
                    <span>10~20만원</span>
                  </label>
                  <label class="filter-price-button">
                    <input type="radio" name="priceRange" value="200000-300000" />
                    <span>20~30만원</span>
                  </label>
                  <label class="filter-price-button">
                    <input type="radio" name="priceRange" value="300000-" />
                    <span>30만원 이상</span>
                  </label>
                </div>
              </section>

              <section class="filter-group">
                <h3 class="filter-group-title">가격 직접 설정</h3>

                <div class="filter-range-slider">
                  <input
                    type="range"
                    name="minPrice"
                    min="0"
                    max="1000000"
                    step="10000"
                    value="100000"
                    aria-label="최소 가격"
                  />
                  <input
                    type="range"
                    name="maxPrice"
                    min="0"
                    max="1000000"
                    step="10000"
                    value="500000"
                    aria-label="최대 가격"
                  />
                </div>

                <div class="filter-price-value">
                  <output>0원</output>
                  <output>1,000,000원</output>
                </div>
              </section>
            </div>

            <div class="filter-actions">
              <button type="reset" class="filter-reset-button">
                <span class="material-icons" aria-hidden="true">refresh</span>
                초기화
              </button>

              <button type="submit" class="filter-submit-button">적용 (20개)</button>
            </div>
          </form>
        </dialog>

        <div class="inner product-list-inner">
          <!-- 현재 리스트 제목 -->
          <div class="product-list-header">
            <div>
              <h1 id="product-list-title">
                <span class="product-list-title-mobile">전체</span>
              </h1>
              <p class="product-count" data-render="product-count">
                <span class="product-count-mobile">총 20개 상품</span>
                <span class="product-count-pc">총 6개 상품</span>
              </p>
            </div>
          </div>

          <!-- 상품 필터/정렬 -->
          <div class="filter-section">
            <aside class="filter-panel" aria-label="상품 필터">
              <button
                type="button"
                class="filter-chip filter-toggle-button"
                aria-expanded="false"
                aria-controls="product-filter-content"
                data-action="toggle-filter"
              >
                <span aria-hidden="true" class="material-icons">filter_alt</span> 필터
              </button>

              <div class="filter-panel-content" id="product-filter-content">
                <!-- 카테고리 필터 -->
                <div class="filter-group category">
                  <button
                    type="button"
                    data-filter-type="category"
                    data-filter-value="안경"
                    class="filter-chip is-active"
                    aria-pressed="true"
                  >
                    안경
                  </button>
                  <button
                    type="button"
                    data-filter-type="category"
                    data-filter-value="선글라스"
                    class="filter-chip"
                  >
                    선글라스
                  </button>
                  <button
                    type="button"
                    data-filter-type="category"
                    data-filter-value="고글"
                    class="filter-chip"
                  >
                    고글
                  </button>
                  <button
                    type="button"
                    data-filter-type="category"
                    data-filter-value="클립온"
                    class="filter-chip"
                  >
                    클립온
                  </button>
                </div>
              </div>
            </aside>

            <div class="product-list-toolbar sort">
              <div class="sort-area" aria-label="상품 정렬">
                <button type="button" class="sort-button is-active" data-sort="basic">
                  기본순
                </button>
                <button type="button" class="sort-button" data-sort="rating-high">별점순</button>
                <button type="button" class="sort-button" data-sort="like-high">좋아요순</button>
                <button type="button" class="sort-button" data-sort="discount-high">
                  할인률 높은순
                </button>
                <button type="button" class="sort-button" data-sort="price-low">가격 낮은순</button>
                <button type="button" class="sort-button" data-sort="price-high">
                  가격 높은순
                </button>
                <button type="button" class="sort-button" data-sort="name">이름순</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 상품 목록 그리드 -->
      <section class="product-list">
        <div class="product-grid product-list-grid" data-render="product-list"></div>

        <!-- 페이지네이션 -->
        <nav class="pagination" aria-label="상품 목록 페이지네이션" data-render="pagination"></nav>

        <!-- 무한스크롤 시작 버튼 -->
        <button type="button" class="product-more-button" data-action="load-more">
          <span>더 보기</span>
          <span class="material-icons" aria-hidden="true">keyboard_arrow_down</span>
        </button>
      </section>
    </main>

    <!-- 푸터 (모듈) -->
    <footer class="footer"></footer>

    <!-- 바텀내비 (모듈) -->
    <nav class="bottom-nav" aria-label="하단 내비게이션" data-component="bottom-nav">
      <a href="index.html"> <span class="material-icons" aria-hidden="true">home</span> 홈 </a>
      <a href="product-list.html" aria-current="page">
        <span class="material-icons" aria-hidden="true">grid_on</span> 상품
      </a>
      <a href="#search-modal" data-action="open-search">
        <span class="material-icons" aria-hidden="true">search</span> 검색
      </a>
      <a href="cart.html">
        <span class="material-icons" aria-hidden="true">local_mall</span>
        <span class="cart-badge" aria-label="장바구니 상품 수">0</span>
        장바구니
      </a>
      <a href="login.html">
        <span class="material-icons" aria-hidden="true">person</span> 내정보
      </a>
    </nav>

    <!-- 고정버튼 -->
    <button
      class="fixed-chat-button"
      aria-label="AI 상담 시작"
      type="button"
      data-action="open-inquiry"
    >
      <span class="material-icons">chat</span>
    </button>

    <!-- 문의 폼 (모듈)-->
    <dialog
      class="inquiry-dialog"
      id="inquiry-dialog"
      aria-labelledby="inquiry-title"
      closedby="any"
    ></dialog>

    <!-- 검색(모듈) -->
    <dialog class="modal" id="search-modal" aria-labelledby="search-modal-title">
      <form method="dialog" class="modal-content">
        <div class="modal-head">
          <h2 id="search-modal-title">검색</h2>
          <button type="submit" class="icon-button material-icons" aria-label="검색 닫기">
            close
          </button>
        </div>
        <label class="form-field">
          <span>검색어</span>
          <input type="search" name="keyword" placeholder="브랜드 또는 상품명을 입력하세요" />
        </label>
      </form>
    </dialog>

    <!-- 토스트 -->
    <div class="toast" role="status" aria-live="polite" data-component="toast"></div>
    <script type="module" src="js/pages/productList.js"></script>
  </body>
</html>
