<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ROUNZ | 회원가입</title>
  </head>
  <body data-signup-step="basic">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <!-- 헤더 모듈 -->
    <header class="header"></header>

    <main id="main" class="signup-page">
      <section class="signup-section" aria-labelledby="signup-title">
        <header class="signup-head">
          <div class="signup-title-area">
            <a class="back-link" href="index.html" aria-label="이전 페이지로 이동">
              <span class="material-icons" aria-hidden="true">arrow_back</span>
            </a>

            <h1 id="signup-title" class="signup-title">회원가입</h1>
          </div>

          <ol class="signup-steps" aria-label="회원가입 단계">
            <li class="signup-step-marker basic-step is-active">
              <span class="blind">1단계 기본 정보</span>
            </li>
            <li class="signup-step-marker terms-step">
              <span class="blind">2단계 약관 동의</span>
            </li>
          </ol>
        </header>

        <form class="signup-form" action="#" method="post">
          <fieldset class="signup-step signup-basic-step">
            <legend class="signup-legend">기본 정보 입력</legend>

            <label class="signup-field" for="signup-email">
              <span class="field-label">이메일</span>
              <input
                id="signup-email"
                name="email"
                type="email"
                placeholder="hello@example.com"
                autocomplete="email"
                required
              />
              <span class="field-message" aria-live="polite"></span>
            </label>

            <label class="signup-field" for="signup-password">
              <span class="field-label">비밀번호</span>

              <span class="password-field">
                <input
                  id="signup-password"
                  name="password"
                  type="password"
                  placeholder="영문, 숫자 포함 8자 이상"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle-button"
                  aria-label="비밀번호 보기"
                  data-action="toggle-password"
                >
                  <span class="material-icons" aria-hidden="true">visibility</span>
                </button>
              </span>

              <span class="field-message" aria-live="polite"></span>
            </label>

            <label class="signup-field" for="signup-password-confirm">
              <span class="field-label">비밀번호 확인</span>

              <span class="password-field">
                <input
                  id="signup-password-confirm"
                  name="password-confirm"
                  type="password"
                  placeholder="비밀번호를 다시 입력하세요"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle-button"
                  aria-label="비밀번호 확인 보기"
                  data-action="toggle-password"
                >
                  <span class="material-icons" aria-hidden="true">visibility</span>
                </button>
              </span>

              <span class="field-message" aria-live="polite"></span>
            </label>

            <label class="signup-field" for="signup-name">
              <span class="field-label">이름</span>
              <input
                id="signup-name"
                name="name"
                type="text"
                placeholder="홍길동"
                autocomplete="name"
                required
              />
              <span class="field-message" aria-live="polite"></span>
            </label>

            <label class="signup-field" for="signup-phone">
              <span class="field-label">휴대폰 번호</span>
              <input
                id="signup-phone"
                name="phone"
                type="tel"
                placeholder="010-0000-0000"
                autocomplete="tel"
                required
              />
              <span class="field-message" aria-live="polite"></span>
            </label>

            <div class="signup-actions">
              <button class="signup-button primary-button" type="button">다음 단계</button>
              <a class="signup-button ghost-button" href="login.html">이미 계정이 있어요</a>
            </div>
          </fieldset>

          <fieldset class="signup-step signup-terms-step" id="terms-step" hidden>
            <legend class="signup-legend">약관 동의</legend>

            <label class="signup-check all-check">
              <input type="checkbox" name="terms-all" />
              <span class="check-box" aria-hidden="true"></span>
              <span class="check-text">
                <strong>전체 동의</strong>
                <small>필수 및 선택 약관에 모두 동의합니다.</small>
              </span>
            </label>

            <div class="signup-terms" aria-label="약관 동의 항목">
              <label class="signup-check">
                <input type="checkbox" name="terms-service" required />
                <span class="check-box" aria-hidden="true"></span>
                <span class="check-text">
                  <strong>이용약관 동의</strong>
                  <small>필수</small>
                </span>
                <a href="#" aria-label="이용약관 자세히 보기">보기</a>
              </label>

              <label class="signup-check">
                <input type="checkbox" name="terms-privacy" required />
                <span class="check-box" aria-hidden="true"></span>
                <span class="check-text">
                  <strong>개인정보 수집 및 이용 동의</strong>
                  <small>필수</small>
                </span>
                <a href="#" aria-label="개인정보 수집 및 이용 약관 자세히 보기">보기</a>
              </label>

              <label class="signup-check">
                <input type="checkbox" name="terms-age" required />
                <span class="check-box" aria-hidden="true"></span>
                <span class="check-text">
                  <strong>만 14세 이상입니다</strong>
                  <small>필수</small>
                </span>
              </label>

              <label class="signup-check">
                <input type="checkbox" name="terms-marketing" />
                <span class="check-box" aria-hidden="true"></span>
                <span class="check-text">
                  <strong>마케팅 정보 수신 동의</strong>
                  <small>선택</small>
                </span>
              </label>
            </div>

            <div class="signup-actions">
              <button class="signup-button primary-button" type="submit">가입 완료</button>
              <button class="signup-button ghost-button" type="button">이전 단계</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>

    <footer class="site-footer" data-component="footer"></footer>
    <nav class="bottom-nav" aria-label="하단 내비게이션" data-component="bottom-nav">
      <a href="index.html"> <span class="material-icons" aria-hidden="true">home</span> 홈 </a>

      <a href="product-list.html">
        <span class="material-icons" aria-hidden="true">grid_on</span> 상품
      </a>

      <a href="#search-modal" data-action="open-search">
        <span class="material-icons" aria-hidden="true">search</span> 검색
      </a>

      <a href="cart.html">
        <span class="material-icons" aria-hidden="true">local_mall</span>
        <span class="cart-badge" aria-label="장바구니 상품 수">0</span>
        장바구니
      </a>

      <a href="login.html" aria-current="page">
        <span class="material-icons" aria-hidden="true">person</span> 내정보
      </a>
    </nav>

    <!-- 고정버튼 -->
    <button
      class="fixed-chat-button"
      aria-label="AI 상담 시작"
      type="button"
      data-action="open-inquiry"
    >
      <span class="material-icons">chat</span>
    </button>

    <!-- 햄버거(모듈) -->
    <aside
      class="hamburger-menu"
      id="hamburger-menu"
      aria-label="전체 메뉴"
      data-component="hamburger-menu"
      hidden
    ></aside>

    <!-- 문의 폼 (모듈)-->
    <dialog class="inquiry-dialog" id="inquiry-dialog" aria-labelledby="inquiry-title"></dialog>

    <dialog class="modal" id="search-modal" aria-labelledby="search-modal-title">
      <form method="dialog" class="modal__content">
        <div class="modal__head">
          <h2 id="search-modal-title">검색</h2>
          <button type="submit" class="icon-button" aria-label="검색 닫기">×</button>
        </div>

        <label class="form-field">
          <span>검색어</span>
          <input type="search" name="keyword" placeholder="브랜드 또는 상품명을 입력하세요" />
        </label>
      </form>
    </dialog>

    <div class="toast" role="status" aria-live="polite" data-component="toast"></div>

    <script type="module" src="js/pages/signup.js"></script>
  </body>
</html>
