<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>BERLIN 3 | ROUNZ</title>
  </head>
  <body class="product-detail-body">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="header"></header>

    <aside
      class="hamburger-menu"
      id="hamburger-menu"
      aria-label="전체 메뉴"
      data-component="hamburger-menu"
      hidden
    ></aside>

    <main id="main" class="main product-detail-page">
      <section class="product-detail-section" aria-labelledby="product-title">
        <div class="inner product-detail-inner">
          <a class="product-detail-back" href="product-list.html">뒤로</a>

          <div class="product-detail-layout">
            <section class="product-gallery" data-render="product-gallery" aria-label="상품 이미지">
              <div class="swiper product-gallery-main-swiper">
                <div class="swiper-wrapper">
                  <div
                    class="swiper-slide product-gallery-main product-gallery-main-angle"
                    role="img"
                    aria-label="얇은 라운드 메탈 안경 BERLIN 3 첫 번째 이미지"
                  ></div>

                  <div
                    class="swiper-slide product-gallery-main product-gallery-main-clear"
                    role="img"
                    aria-label="얇은 라운드 메탈 안경 BERLIN 3 두 번째 이미지"
                  ></div>

                  <div
                    class="swiper-slide product-gallery-main product-gallery-main-bold"
                    role="img"
                    aria-label="얇은 라운드 메탈 안경 BERLIN 3 세 번째 이미지"
                  ></div>
                </div>

                <button
                  id="product-gallery-prev"
                  class="product-gallery-arrow product-gallery-arrow-prev"
                  type="button"
                  aria-label="이전 이미지"
                >
                  ‹
                </button>

                <button
                  id="product-gallery-next"
                  class="product-gallery-arrow product-gallery-arrow-next"
                  type="button"
                  aria-label="다음 이미지"
                >
                  ›
                </button>

                <div class="product-gallery-dots"></div>
              </div>

              <div class="swiper product-gallery-thumb-swiper" aria-label="상품 썸네일">
                <div class="swiper-wrapper">
                  <button
                    class="swiper-slide product-gallery-thumb"
                    type="button"
                    aria-label="첫 번째 상품 이미지"
                  >
                    <span class="product-thumb product-thumb-angle" aria-hidden="true"></span>
                  </button>
                  <button
                    class="swiper-slide product-gallery-thumb"
                    type="button"
                    aria-label="두 번째 상품 이미지"
                  >
                    <span class="product-thumb product-thumb-clear" aria-hidden="true"></span>
                  </button>
                  <button
                    class="swiper-slide product-gallery-thumb"
                    type="button"
                    aria-label="세 번째 상품 이미지"
                  >
                    <span class="product-thumb product-thumb-bold" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="product-gallery-thumb-scrollbar" aria-hidden="true"></div>
              </div>
            </section>

            <section
              class="product-summary"
              data-render="product-summary"
              aria-label="상품 구매 정보"
            >
              <div class="product-summary-head">
                <p class="product-summary-brand">
                  <a href="product-list.html?brand=mykita"
                    >MYKITA
                    <span class="material-icons" aria-hidden="true">keyboard_arrow_right</span>
                  </a>
                </p>
                <button type="button" class="product-share-button" aria-label="상품 공유">
                  <span class="material-icons" aria-hidden="true">share</span>
                  <!-- <span aria-hidden="true"></span> -->
                </button>
              </div>

              <h1 id="product-title">BERLIN 3</h1>
              <p class="product-summary-rating" aria-label="상품 평점">
                <span class="product-summary-stars" aria-hidden="true"></span>
                <strong class="product-summary-rating-score">0.0</strong>
                <a class="product-summary-review-count" href="#product-reviews">(0)</a>
              </p>
              <p class="product-summary-price">
                <strong>420,000원</strong>
                <del>248,000원</del>
                <span>-20%</span>
              </p>
              <div class="product-purchase-actions">
                <button type="button" class="btn btn-dark" data-action="add-cart">
                  <span class="material-icons" aria-hidden="true">local_mall</span>
                  장바구니 담기
                </button>
              </div>
              <dl class="product-spec-grid">
                <div>
                  <dt>프레임</dt>
                  <dd>캣아이</dd>
                </div>
                <div>
                  <dt>소재</dt>
                  <dd>스테인리스</dd>
                </div>
                <div>
                  <dt>사이즈</dt>
                  <dd>M</dd>
                </div>
                <div>
                  <dt>성별</dt>
                  <dd>여성</dd>
                </div>
              </dl>

              <div class="product-option-group" aria-labelledby="face-shape-label">
                <p id="face-shape-label">추천 얼굴형</p>
                <div class="product-chip-list">
                  <span>둥근형</span>
                  <span>타원형</span>
                </div>
              </div>

              <fieldset class="product-option-group product-color-option">
                <legend>색상 선택 - 실버</legend>
                <div class="product-chip-list">
                  <label>
                    <input type="radio" name="product-color" value="black" checked />
                    <span>블랙</span>
                  </label>
                  <label>
                    <input type="radio" name="product-color" value="gold" />
                    <span>골드</span>
                  </label>
                  <label>
                    <input type="radio" name="product-color" value="silver" />
                    <span>실버</span>
                  </label>
                </div>
              </fieldset>

              <div class="product-quantity" aria-label="수량 선택">
                <button type="button" aria-label="수량 감소" data-quantity-action="decrease">
                  −
                </button>
                <span aria-live="polite">1</span>
                <button type="button" aria-label="수량 증가" data-quantity-action="increase">
                  +
                </button>
              </div>
              <p
                class="product-summary-description product-summary-description-pc"
                data-render="product-description"
              ></p>
            </section>
          </div>
        </div>
      </section>

      <section
        class="product-info-section"
        aria-label="상품 상세 정보"
        data-render="product-detail-content"
      >
        <div class="inner product-detail-content-inner">
          <div class="product-detail-tabs">
            <div class="tab-list" role="tablist" aria-label="상품 정보 탭">
              <button
                type="button"
                class="tab-button active"
                id="detail-tab"
                role="tab"
                aria-selected="true"
                aria-controls="detail-panel"
                data-tab="detail"
              >
                상세정보
              </button>
              <button
                type="button"
                class="tab-button"
                id="review-tab"
                role="tab"
                aria-selected="false"
                aria-controls="review-panel"
                data-tab="review"
              >
                리뷰
              </button>
              <button
                type="button"
                class="tab-button"
                id="qna-tab"
                role="tab"
                aria-selected="false"
                aria-controls="qna-panel"
                data-tab="qna"
              >
                문의
              </button>
            </div>

            <div
              class="tab-panel"
              id="detail-panel"
              role="tabpanel"
              aria-labelledby="detail-tab"
              data-tab="detail"
            >
              <p
                class="product-summary-description product-summary-description-mobile"
                data-render="product-description"
              ></p>
            </div>
            <div
              class="tab-panel"
              id="review-panel"
              role="tabpanel"
              aria-labelledby="review-tab"
              data-tab="review"
              hidden
            ></div>
            <div
              class="tab-panel"
              id="qna-panel"
              role="tabpanel"
              aria-labelledby="qna-tab"
              data-tab="qna"
              hidden
            ></div>
          </div>

          <section class="review-section" id="product-reviews" aria-labelledby="review-title">
            <div class="review-section-head">
              <h2 id="review-title">구매 후기 <span data-render="review-count">(0)</span></h2>
              <button type="button" class="review-write-button">후기 작성</button>
            </div>
            <div class="review-list" data-render="product-review-list">
              <p class="review-empty">상품 후기를 불러오는 중입니다.</p>
            </div>
          </section>

          <section class="product-qna-section" aria-labelledby="qna-title">
            <h2 id="qna-title" class="sr-only">상품 문의</h2>
            <div data-render="product-qna-list"></div>
          </section>

          <section class="related-products" aria-labelledby="related-title">
            <h2 id="related-title">비슷한 상품</h2>
            <div class="related-products-grid" data-render="related-products"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="footer"></footer>

    <nav class="bottom-nav" aria-label="하단 내비게이션" data-component="bottom-nav">
      <a href="index.html"> <span class="material-icons" aria-hidden="true">home</span> 홈 </a>
      <a href="product-list.html">
        <span class="material-icons" aria-hidden="true">grid_on</span> 상품
      </a>
      <a href="#search-modal" data-action="open-search">
        <span class="material-icons" aria-hidden="true">search</span> 검색
      </a>
      <a href="cart.html">
        <span class="material-icons" aria-hidden="true">local_mall</span>
        <span class="cart-badge" aria-label="장바구니 상품 수" data-render="cart-count">0</span>
        장바구니
      </a>
      <a href="login.html">
        <span class="material-icons" aria-hidden="true">person</span> 내정보
      </a>
    </nav>

    <a class="fixed-chat-button" href="#search-modal" aria-label="AI 상담 시작">
      <span class="sr-only">AI 상담</span>
    </a>

    <dialog class="modal" id="search-modal" aria-labelledby="search-modal-title">
      <form method="dialog" class="modal-content">
        <div class="modal-head">
          <h2 id="search-modal-title">검색</h2>
          <button type="submit" class="icon-button" aria-label="검색 닫기">×</button>
        </div>
        <label class="form-field">
          <span>검색어</span>
          <input type="search" name="keyword" placeholder="브랜드 또는 상품명을 입력하세요" />
        </label>
      </form>
    </dialog>

    <div class="toast" role="status" aria-live="polite" data-component="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script type="module" src="js/pages/productDetail.js"></script>
  </body>
</html>
