<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ROUNZ | 장바구니</title>
  </head>
  <body data-cart-state="empty">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="header"></header>

    <!-- 햄버거(모듈) -->
    <aside
      class="hamburger-menu"
      id="hamburger-menu"
      aria-label="전체 메뉴"
      data-component="hamburger-menu"
      hidden
    ></aside>

    <main id="main" class="cart-page">
      <section class="cart-page__state cart-page__state--empty" aria-labelledby="cart-empty-title">
        <div class="cart-empty">
          <span class="material-icons">local_mall</span>
          <h2 id="cart-empty-title" class="cart-empty__title">장바구니가 비었습니다</h2>
          <p class="cart-empty__description">마음에 드는 상품을 담아보세요</p>
          <a class="cart-button cart-button--primary" href="product-list.html">
            쇼핑 시작하기
            <span aria-hidden="true">→</span>
          </a>
        </div>
        <section class="cart-recommend" aria-labelledby="cart-empty-recommend-title">
          <div class="cart-section-heading">
            <h2 id="cart-recommend-title">추천 상품</h2>
            <a href="product-list.html?sort=best">전체보기</a>
          </div>
          <div class="cart-recommend-swiper swiper">
            <button type="button" class="cart-recommend-prev" aria-label="이전 추천 상품">
              <span class="material-icons" aria-hidden="true">chevron_left</span>
            </button>
            <div class="cart-recommend__list swiper-wrapper" data-render="cart-recommend-products">
              <!-- js로 추천 상품 슬라이드 랜더 -->
            </div>
            <button type="button" class="cart-recommend-next" aria-label="다음 추천 상품">
              <span class="material-icons" aria-hidden="true">chevron_right</span>
            </button>
          </div>
        </section>
      </section>

      <section
        class="cart-page__state cart-page__state--filled"
        aria-labelledby="cart-filled-title"
      >
        <div class="cart-page__layout">
          <section class="cart-items" aria-labelledby="cart-filled-title">
            <div class="cart-section-heading">
              <h2 id="cart-filled-title">
                장바구니 <span class="cart-count-text" data-render="cart-count">1</span>
              </h2>
              <p data-render="cart-total-count">총 1개의 상품</p>
            </div>

            <div class="cart-select-bar">
              <label>
                <input type="checkbox" data-action="cart-select-all" />
                <span>전체선택 <em data-render="cart-selected-count">(0/0)</em></span>
              </label>
              <button type="button" data-action="cart-remove-selected">선택삭제</button>
            </div>

            <div class="cart-items__list" data-render="cart-items">
              <!--
              JavaScript로 상품 목록 렌더
            --></div>
          </section>

          <aside class="cart-summary" aria-labelledby="cart-summary-title">
            <h2 id="cart-summary-title" class="cart-summary__title">주문 요약</h2>
            <dl class="cart-summary__list">
              <div>
                <dt>상품 금액</dt>
                <dd data-render="cart-subtotal">198,000원</dd>
              </div>
              <div>
                <dt>배송비</dt>
                <dd data-render="cart-shipping">무료</dd>
              </div>
              <div class="cart-summary__total">
                <dt>총 결제 금액</dt>
                <dd data-render="cart-total">198,000원</dd>
              </div>
              <div>
                <dt>배송 예정</dt>
                <dd>결제 후 2-3일 이내 출고</dd>
              </div>
            </dl>
            <div class="cart-summary__actions">
              <a class="cart-button cart-button--primary" href="#">주문하기</a>
              <a class="cart-button cart-button--secondary" href="product-list.html"
                >계속 쇼핑하기</a
              >
            </div>
          </aside>
        </div>
        <section class="cart-recommend" aria-labelledby="cart-empty-recommend-title">
          <div class="cart-section-heading">
            <h2 id="cart-recommend-title">추천 상품</h2>
            <a href="product-list.html?sort=best">전체보기</a>
          </div>
          <div class="cart-recommend-swiper swiper">
            <button type="button" class="cart-recommend-prev" aria-label="이전 추천 상품">
              <span class="material-icons" aria-hidden="true">chevron_left</span>
            </button>
            <div class="cart-recommend__list swiper-wrapper" data-render="cart-recommend-products">
              <!-- js로 추천 상품 슬라이드 랜더 -->
            </div>
            <button type="button" class="cart-recommend-next" aria-label="다음 추천 상품">
              <span class="material-icons" aria-hidden="true">chevron_right</span>
            </button>
          </div>
        </section>
      </section>
    </main>

    <!-- 고정버튼 -->
    <button
      class="fixed-chat-button"
      aria-label="AI 상담 시작"
      type="button"
      data-action="open-inquiry"
    >
      <span class="material-icons">chat</span>
    </button>

    <!-- 문의 폼 (모듈)-->
    <dialog
      class="inquiry-dialog"
      id="inquiry-dialog"
      aria-labelledby="inquiry-title"
      closedby="any"
    ></dialog>

    <footer class="footer"></footer>

    <nav class="bottom-nav" aria-label="하단 네비게이션" data-component="bottom-nav">
      <a href="index.html"> <span class="material-icons" aria-hidden="true">home</span> 홈 </a>
      <a href="product-list.html">
        <span class="material-icons" aria-hidden="true">grid_on</span> 상품
      </a>
      <a href="#search-modal" data-action="open-search">
        <span class="material-icons" aria-hidden="true">search</span> 검색
      </a>
      <a href="cart.html" aria-current="page">
        <span class="material-icons" aria-hidden="true">local_mall</span>
        <span class="cart-badge" aria-label="장바구니에 추가된 상품 수" data-render="cart-count"
          >2</span
        >
        장바구니
      </a>
      <a href="login.html">
        <span class="material-icons" aria-hidden="true">person</span> 내정보
      </a>
    </nav>

    <div class="toast" role="status" aria-live="polite" data-component="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="./js/pages/cart.js"></script>
  </body>
</html>
